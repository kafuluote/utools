[package]
name = "exchange-tools"
version = "0.6.0"
description = "汇率换算、二维码解码与生成、JSON 解析与 Unix 时间转换工具"
authors = ["Exchange Tools"]
edition = "2021"

[lib]
name = "exchange_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
rqrr = "0.11"
arboard = "3.6"
rfd = "0.17"
base64 = "0.22"
encoding_rs = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
semver = "1"
open = "5"
qrcode = { version = "0.14", default-features = false }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
